<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F5F2"/>
      <stop offset="100%" stop-color="#EFEAE3"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8E2D8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E2D8"/>
    </linearGradient>

    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="800" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" rx="24" fill="url(#bg)"/>

  <rect width="1200" height="800" rx="24" fill="#EAE4DB"/>

  <rect x="-1200" y="0" width="1200" height="800"
        fill="url(#shine)"
        opacity="0.75"
        clip-path="url(#clip)">
    <animate attributeName="x"
             values="-1200;1200"
             dur="1.3s"
             repeatCount="indefinite"/>
  </rect>
</svg>